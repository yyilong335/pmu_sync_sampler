# Aegis feature set — GP counter event list for the synchronous PMU sampler.
#
# Matches simpoint_perf/perf_event_mapper.c::FEATURE_INDICES_DEFAULT
# = {0, 1, 2, 3, 6, 28, 31, 34, 35, 26}, with the exception of index 31
# (context switches — software counter, not measurable from a hardware
# NMI handler). The three fixed counters (Instructions, CORE cycles,
# REF_TSC) cover indices 0, 27, 26 automatically.
#
# Slots 0..7 are written to /sys/sync_pmu/0..7 in order. USR/OS/EN are
# forced by the driver.

LOAD              0x81D0       # MEM_INST_RETIRED.ALL_LOADS
L1D_REPLACEMENT   0x0151       # L1D.REPLACEMENT (L1D read miss)
STORE             0x82D0       # MEM_INST_RETIRED.ALL_STORES
L1I_MISS          0x0283       # ICACHE_64B.IFTAG_MISS
BRANCH            0x00C4       # BR_INST_RETIRED.ALL_BRANCHES
LLC_REFERENCE     0x4F2E       # LONGEST_LAT_CACHE.REFERENCE
LLC_MISS          0x412E       # LONGEST_LAT_CACHE.MISS
