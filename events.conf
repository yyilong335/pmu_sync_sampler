# GP counter event list for the synchronous PMU sampler.
#
# One non-comment line per slot. Read into /sys/sync_pmu/<slot> in order,
# starting at slot 0. Slots beyond the last entry are written as 0
# (counter still ticks with EN=1 but EVENT=0, which is "no event").
# Maximum 8 slots (NUM_GP_COUNTERS).
#
# Each line:   <NAME>   <EVENTSEL_LOW32>   [optional comment]
# Encoding is the low 32 bits of MSR_PERFEVTSEL: event(0..7) | umask(8..15) |
# edge(18) | anythread(21) | invert(23) | cmask(24..31).
# USR/OS/EN bits are forced by the driver; do not set them.
# Hex (0x...) and decimal both accepted.
#
# Skylake-SP (Xeon Gold 6142) encodings; SDM Vol. 3B Ch. 19.
# The 3 fixed counters (INST_RETIRED.ANY, CPU_CLK_UNHALTED.CORE,
# CPU_CLK_UNHALTED.REF_TSC) are always enabled and not configurable here.

STALL_ISSUE       0x0180010E   # UOPS_ISSUED.STALL_CYCLES (cmask=1, invert=1)
STALL_RETIRE      0x018002C2   # UOPS_RETIRED.STALL_CYCLES (cmask=1, invert=1)
LOAD              0x81D0       # MEM_INST_RETIRED.ALL_LOADS
STORE             0x82D0       # MEM_INST_RETIRED.ALL_STORES
BRANCH            0x00C4       # BR_INST_RETIRED.ALL_BRANCHES
L1D_REPLACEMENT   0x0151       # L1D.REPLACEMENT (L1D read miss)
L1I_MISS          0x0283       # ICACHE_64B.IFTAG_MISS
